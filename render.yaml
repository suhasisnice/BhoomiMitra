# Render blueprint for both halves of BhoomiMitra.
#
# One repository, two services. `rootDir` is what makes that work: every
# other path in a service block — dockerfilePath, dockerContext,
# buildCommand, staticPublishPath — resolves relative to it, not to the
# repository root.
#
# See DEPLOYMENT.md for the order these have to be created in and for the
# values of the variables marked `sync: false`.

services:
  # ---------------------------------------------------------------- API ---
  - type: web
    name: sih26016-api
    runtime: docker
    plan: free
    # Render has no India region — its five are Oregon, Ohio, Virginia,
    # Frankfurt and Singapore — so Singapore is the closest to the users
    # this is for. Create the Supabase project in Singapore too: the
    # API-to-database hop is paid per query, several times per request,
    # while the user-to-API hop is paid once. DEPLOYMENT.md §1 has the
    # full argument for why co-locating beats putting the database in
    # Mumbai even though Mumbai is nearer the users.
    region: singapore

    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /health runs a real SELECT 1. It answers 200 with
    # {"database": "unreachable"} rather than failing when the database is
    # down, which is deliberate: a Supabase blip should show up in the
    # response body, not restart the API instance underneath it.
    healthCheckPath: /health

    envVars:
      # Turns on the boot-time guards in backend/app/config.py. Without
      # this the API would start happily with the built-in dev SECRET_KEY.
      - key: ENVIRONMENT
        value: production

      # Render generates a long random value on first deploy and keeps it.
      # Rotating it invalidates every issued token — everyone signs in
      # again, nothing else breaks.
      - key: SECRET_KEY
        generateValue: true

      # Set in the dashboard, never in this file: it carries the database
      # password, and this repository is public. Use the Supabase
      # *transaction pooler* string (port 6543) — backend/app/database.py
      # switches to NullPool when it sees that port, which is what
      # pgbouncer requires.
      - key: DATABASE_URL
        sync: false

      # The deployed frontend's origin. Comma-separated if more than one.
      # Must not be "*" — the config guard refuses to boot on a wildcard,
      # because credentialed requests cannot use one anyway.
      - key: FRONTEND_ORIGIN
        sync: false

    # Uploaded documents land in /app/uploads, which is ephemeral on the
    # free plan — every deploy and every wake-from-sleep starts with an
    # empty directory while the document rows still point at the files.
    # A disk fixes it and is not free; DEPLOYMENT.md spells out the
    # trade-off rather than leaving it to be discovered.
    #
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

  # ----------------------------------------------------------- FRONTEND ---
  # No `region` here on purpose: a static site is served from Render's CDN
  # rather than from one datacentre, so there is no region to choose.
  - type: web
    name: bhoomimitra
    runtime: static
    rootDir: frontend

    # `npm ci` not `npm install`: it installs exactly what package-lock.json
    # pins, so the deployed bundle is built from the same dependency tree
    # that was tested locally.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite inlines VITE_* at BUILD time, so this has to be right before
      # the build runs. Changing it in the dashboard does nothing until the
      # next deploy — the most common way a deployed frontend ends up
      # calling localhost. Set it to the API service's URL, no trailing
      # slash.
      - key: VITE_API_URL
        sync: false

      # VITE_SHOW_DEMO_ACCOUNTS and VITE_DEMO_PASSWORD are deliberately
      # absent. The login page renders its demo-account list only when the
      # first is exactly "true", and that list names six working accounts,
      # one of them a State Administrator. Leaving it unset is what keeps
      # them off a public login page.

    routes:
      # React Router owns the paths. Without this, a reload on /cases/12
      # asks Render for a file that does not exist and gets a 404 — the
      # app only ever ships one HTML file.
      - type: rewrite
        source: /*
        destination: /index.html
